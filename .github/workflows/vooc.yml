name: VOOC

on:
  push:
    paths: ["vooc/macos/**", ".github/workflows/vooc.yml"]
  pull_request:
    paths: ["vooc/macos/**", ".github/workflows/vooc.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vooc/macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: swift test
