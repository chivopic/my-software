# 本地开发用的 Postgres。生产用托管数据库，不用这个文件。
#   pnpm db:up      启动
#   pnpm db:down    停止（保留数据）
services:
  postgres:
    image: postgres:16-alpine
    container_name: workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
