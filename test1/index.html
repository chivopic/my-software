<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="一个克制、本地优先的移动端记录与任务工作台" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <title>Today</title>
  <style>
    :root{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--text:#20211f;--muted:#73756f;--line:#e5e6e1;--soft:#f0f1ed;--accent:#2f5d49;--r:12px;--safe:env(safe-area-inset-bottom,0px);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#171815;--surface:#1e201d;--text:#eceee8;--muted:#a6aaa1;--line:#30332e;--soft:#252823;--accent:#87b59c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100dvh;max-width:720px;margin:auto}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) clamp(16px,4vw,28px) 12px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent)}.eyebrow{margin:0 0 2px;color:var(--muted);font-size:12px}.top h1{margin:0;font-size:clamp(21px,5.2vw,28px);line-height:1.2;font-weight:670}.content{padding:14px clamp(16px,4vw,28px) calc(92px + var(--safe))}.view{display:none}.view.active{display:block}.icon{width:36px;height:36px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent}.icon:hover,.icon:focus-visible{background:var(--soft);outline:none}.icon svg{width:18px;height:18px;stroke-width:1.8}.capture,.inline-create,.search{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 7px 7px 12px}.capture input,.inline-create input,.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;min-height:36px}.capture .submit{background:var(--text);color:var(--bg)}.hint{margin:7px 2px 0;color:var(--muted);font-size:12px}.section{margin-top:clamp(22px,6vw,34px)}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 8px}.section-head h2{margin:0;font-size:15px;font-weight:650}.quiet{border:0;background:transparent;padding:4px 0;color:var(--muted);font-size:13px}.quiet:hover,.quiet:focus-visible{color:var(--text);outline:none}.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.row{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.main{min-width:0;flex:1}.title{margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}.meta{margin-top:4px;color:var(--muted);font-size:11.5px}.note{cursor:pointer}.note:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}.check{width:20px;height:20px;flex:0 0 auto;margin-top:1px;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:grid;place-items:center}.check svg{display:none;width:13px;height:13px}.done .check{border-color:var(--accent);color:var(--accent)}.done .check svg{display:block}.done .title{color:var(--muted);text-decoration:line-through}.actions{display:flex;margin-left:auto}.actions .icon{width:30px;height:30px;color:var(--muted)}.actions .icon svg{width:16px;height:16px}.search{grid-template-columns:auto 1fr;padding:0 11px}.search svg{width:17px;height:17px;color:var(--muted)}.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12.5px;white-space:nowrap}.chip.active{background:var(--soft);color:var(--text)}.inline-create{margin:12px 0}.empty{padding:20px 14px;color:var(--muted);text-align:center;font-size:13px;border:1px dashed var(--line);border-radius:var(--r)}.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 14px calc(7px + var(--safe));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(16px)}.nav{min-height:46px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:9px;font-size:10.5px}.nav svg{width:19px;height:19px;stroke-width:1.8}.nav.active{color:var(--text)}.nav:hover,.nav:focus-visible{background:var(--soft);outline:none}.sheet{width:min(720px,100%);max-width:none;margin:auto auto 0;padding:0;border:0;background:transparent}.sheet::backdrop{background:rgb(0 0 0/.28)}.sheet-card{max-height:min(78dvh,640px);overflow:auto;padding:8px clamp(16px,4vw,24px) calc(18px + var(--safe));border-radius:16px 16px 0 0;background:var(--surface);border-top:1px solid var(--line)}.handle{width:34px;height:4px;margin:1px auto 10px;border-radius:999px;background:var(--line)}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sheet-head h2{margin:0;font-size:15px}.sheet textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:11px;outline:none;color:var(--text);background:var(--bg);line-height:1.55}.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 13px;background:transparent}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.settings{border-top:1px solid var(--line)}.setting{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.setting strong{display:block;font-size:14px}.setting small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.4}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:760px){body{background:#eceee9}:root[data-theme="dark"] body{background:#111210}.app{min-height:calc(100dvh - 24px);margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:clip}.bottom{bottom:12px;border:1px solid var(--line);border-radius:0 0 16px 16px}.sheet{margin-bottom:12px}.sheet-card{border-radius:16px;border:1px solid var(--line)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div><p class="eyebrow" id="dateLabel">Today</p><h1 id="pageTitle">今天</h1></div>
      <button class="icon" id="settingsButton" aria-label="设置" title="设置"><i data-lucide="settings-2"></i></button>
    </header>
    <main class="content">
      <section class="view active" data-view="today">
        <form class="capture" id="captureForm">
          <label class="sr-only" for="captureInput">快速记录</label>
          <input id="captureInput" maxlength="180" autocomplete="off" placeholder="记录想法，或输入 /task 添加任务" />
          <button class="icon submit" type="submit" aria-label="添加" title="添加"><i data-lucide="arrow-up"></i></button>
        </form>
        <p class="hint">默认保存为记录；以 <code>/task</code> 开头则保存为任务。</p>
        <section class="section"><div class="section-head"><h2>接下来</h2><button class="quiet" data-nav="tasks">全部任务</button></div><div id="todayTasks"></div></section>
        <section class="section"><div class="section-head"><h2>最近记录</h2><button class="quiet" data-nav="notes">全部记录</button></div><div id="todayNotes"></div></section>
      </section>
      <section class="view" data-view="notes">
        <div class="search"><i data-lucide="search"></i><input id="notesSearch" type="search" placeholder="搜索记录" /></div>
        <div class="section-head" style="margin-top:18px"><h2>记录</h2><button class="quiet" id="newNoteButton">新建</button></div>
        <div id="notesList"></div>
      </section>
      <section class="view" data-view="tasks">
        <div class="filters"><button class="chip active" data-filter="open">待完成</button><button class="chip" data-filter="all">全部</button><button class="chip" data-filter="done">已完成</button></div>
        <form class="inline-create" id="taskForm"><input id="taskInput" maxlength="120" placeholder="添加任务" /><button class="icon" type="submit" aria-label="添加任务" title="添加任务"><i data-lucide="plus"></i></button></form>
        <div id="tasksList"></div>
      </section>
    </main>
    <nav class="bottom" aria-label="主导航">
      <button class="nav active" data-nav="today"><i data-lucide="sun"></i><span>今天</span></button>
      <button class="nav" data-nav="notes"><i data-lucide="notebook-text"></i><span>记录</span></button>
      <button class="nav" data-nav="tasks"><i data-lucide="circle-check-big"></i><span>任务</span></button>
    </nav>
  </div>

  <dialog class="sheet" id="editorDialog"><form method="dialog" class="sheet-card" id="editorForm"><div class="handle"></div><div class="sheet-head"><h2 id="editorTitle">新建记录</h2><button class="icon" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button></div><textarea id="editorText" maxlength="2000" rows="9" placeholder="写点什么…"></textarea><div class="sheet-actions"><button class="btn" value="cancel">取消</button><button class="btn primary" value="default">保存</button></div></form></dialog>
  <dialog class="sheet" id="settingsDialog"><form method="dialog" class="sheet-card"><div class="handle"></div><div class="sheet-head"><h2>设置</h2><button class="icon" value="cancel" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="settings"><label class="setting"><span><strong>深色模式</strong><small>手动覆盖设备主题</small></span><input type="checkbox" id="themeToggle" /></label><div class="setting"><span><strong>本地优先</strong><small>记录和任务存放在当前浏览器 IndexedDB</small></span><i data-lucide="database"></i></div></div></form></dialog>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    const DB='test1-workspace',VER=1;let view='today',filter='open',editing=null;const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
    const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
    function db(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,VER);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('notes'))d.createObjectStore('notes',{keyPath:'id'});if(!d.objectStoreNames.contains('tasks'))d.createObjectStore('tasks',{keyPath:'id'})};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
    async function all(name){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(name).objectStore(name).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}
    async function put(name,value){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(name,'readwrite');t.objectStore(name).put(value);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
    async function del(name,id){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(name,'readwrite');t.objectStore(name).delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
    const icons=()=>window.lucide&&lucide.createIcons({attrs:{'stroke-width':1.8}});const fmt=t=>new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t));
    const empty=t=>`<div class="empty">${t}</div>`;
    function taskRow(t){const el=document.createElement('div');el.className=`row task ${t.done?'done':''}`;el.innerHTML=`<button class="check" aria-label="${t.done?'标记未完成':'完成任务'}"><i data-lucide="check"></i></button><div class="main"><p class="title"></p><div class="meta">${fmt(t.createdAt)}</div></div><div class="actions"><button class="icon trash" aria-label="删除任务" title="删除"><i data-lucide="trash-2"></i></button></div>`;$('.title',el).textContent=t.text;$('.check',el).onclick=async()=>{t.done=!t.done;t.updatedAt=Date.now();await put('tasks',t);render()};$('.trash',el).onclick=async()=>{await del('tasks',t.id);render()};return el}
    function noteRow(n){const el=document.createElement('div');el.className='row note';el.innerHTML=`<div class="main"><p class="title"></p><div class="meta">${fmt(n.updatedAt)}</div></div><div class="actions"><button class="icon trash" aria-label="删除记录" title="删除"><i data-lucide="trash-2"></i></button></div>`;const s=n.text.replace(/\s+/g,' ').trim();$('.title',el).textContent=s.length>120?s.slice(0,120)+'…':s;el.onclick=e=>{if(!e.target.closest('.trash'))openEditor(n)};$('.trash',el).onclick=async()=>{await del('notes',n.id);render()};return el}
    async function renderToday(){const[tasks,notes]=await Promise.all([all('tasks'),all('notes')]);const a=$('#todayTasks'),b=$('#todayNotes');a.innerHTML='';b.innerHTML='';const ot=tasks.filter(x=>!x.done).sort((x,y)=>y.createdAt-x.createdAt).slice(0,4),rn=notes.sort((x,y)=>y.updatedAt-x.updatedAt).slice(0,4);if(!ot.length)a.innerHTML=empty('当前没有待完成任务');else{a.className='list';ot.forEach(x=>a.append(taskRow(x)))}if(!rn.length)b.innerHTML=empty('还没有记录');else{b.className='list';rn.forEach(x=>b.append(noteRow(x)))}}
    async function renderTasks(){let a=await all('tasks');a.sort((x,y)=>Number(x.done)-Number(y.done)||y.createdAt-x.createdAt);if(filter==='open')a=a.filter(x=>!x.done);if(filter==='done')a=a.filter(x=>x.done);const c=$('#tasksList');c.innerHTML='';c.className=a.length?'list':'';if(!a.length)c.innerHTML=empty(filter==='done'?'暂无已完成任务':filter==='open'?'当前没有待完成任务':'还没有任务');else a.forEach(x=>c.append(taskRow(x)))}
    async function renderNotes(){const q=$('#notesSearch').value.trim().toLowerCase();let a=await all('notes');a.sort((x,y)=>y.updatedAt-x.updatedAt);if(q)a=a.filter(x=>x.text.toLowerCase().includes(q));const c=$('#notesList');c.innerHTML='';c.className=a.length?'list':'';if(!a.length)c.innerHTML=empty(q?'没有匹配的记录':'还没有记录');else a.forEach(x=>c.append(noteRow(x)))}
    async function render(){await Promise.all([renderToday(),renderTasks(),renderNotes()]);icons()}
    function nav(v){view=v;$$('.view').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===v));$('#pageTitle').textContent={today:'今天',notes:'记录',tasks:'任务'}[v];icons()}
    function openEditor(n=null){editing=n?.id||null;$('#editorTitle').textContent=n?'编辑记录':'新建记录';$('#editorText').value=n?.text||'';$('#editorDialog').showModal();setTimeout(()=>$('#editorText').focus(),50)}
    async function seed(){const[n,t]=await Promise.all([all('notes'),all('tasks')]);if(n.length||t.length)return;const now=Date.now();await put('notes',{id:uid(),text:'这是一个本地优先的移动工作台。打开即记录，不要求先整理。',createdAt:now-3600000,updatedAt:now-3600000});await put('tasks',{id:uid(),text:'试着完成一个任务，再新增一条记录',done:false,createdAt:now-1800000,updatedAt:now-1800000})}
    function theme(){const saved=localStorage.getItem('test1-theme'),dark=saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';$('#themeToggle').checked=dark}
    $$('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('#captureForm').onsubmit=async e=>{e.preventDefault();const i=$('#captureInput'),raw=i.value.trim();if(!raw)return;const task=/^\/task(\s|$)/i.test(raw),text=raw.replace(/^\/task\s*/i,'').trim();if(!text)return;const now=Date.now();if(task)await put('tasks',{id:uid(),text,done:false,createdAt:now,updatedAt:now});else await put('notes',{id:uid(),text,createdAt:now,updatedAt:now});i.value='';render()};
    $('#taskForm').onsubmit=async e=>{e.preventDefault();const i=$('#taskInput'),text=i.value.trim();if(!text)return;const now=Date.now();await put('tasks',{id:uid(),text,done:false,createdAt:now,updatedAt:now});i.value='';render()};$$('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;$$('.chip').forEach(x=>x.classList.toggle('active',x===c));renderTasks().then(icons)});$('#notesSearch').oninput=renderNotes;$('#newNoteButton').onclick=()=>openEditor();$('#settingsButton').onclick=()=>$('#settingsDialog').showModal();$('#editorForm').onsubmit=async e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();const text=$('#editorText').value.trim();if(!text)return;const old=editing?(await all('notes')).find(x=>x.id===editing):null,now=Date.now();await put('notes',{id:editing||uid(),text,createdAt:old?.createdAt||now,updatedAt:now});$('#editorDialog').close();editing=null;render()};$('#themeToggle').onchange=e=>{const t=e.target.checked?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('test1-theme',t)};
    $('#dateLabel').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long',month:'long',day:'numeric'}).format(new Date());theme();seed().then(render);nav(view);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
  </script>
</body>
</html>
