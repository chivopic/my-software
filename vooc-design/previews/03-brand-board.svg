  <g transform="translate(1015 590)" class="ui"><rect width="315" height="190" rx="18" fill="#e9e2d5"/><text x="26" y="42" class="muted" font-size="11" font-weight="700" letter-spacing="1.6">VOICE</text><text x="26" y="78" class="ink" font-size="20" font-weight="600">Warm, lucid, unhurried.</text><text x="26" y="112" class="muted" font-size="14">Useful without sounding mechanical.</text><text x="26" y="138" class="muted" font-size="14">Confident without demanding attention.</text><circle cx="278" cy="42" r="8" fill="#c56f4b"/></g>
