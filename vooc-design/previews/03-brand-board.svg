  <g transform="translate(500 258)"><text class="ui ink" font-size="112" font-weight="650" letter-spacing="18">VOOC</text><path d="M181 24c20-18 46-18 66 0" fill="none" stroke="#c56f4b" stroke-width="4" stroke-linecap="round"/><text y="94" class="ui muted" font-size="17" letter-spacing="2.2">NOTES FOR A MORE ATTENTIVE LIFE</text><text y="150" class="ui ink" font-size="19">The folded page becomes a V.</text><text y="180" class="ui muted" font-size="15">Two planes meet like linked ideas; the inner line suggests writing.</text></g>
