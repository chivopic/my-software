  <g class="ui"><text x="646" y="139" class="muted" font-size="12">Personal / Journal</text><text x="1315" y="139" class="muted" font-size="16">⌘  ◫</text></g>
  <g transform="translate(750 185)"><text class="serif ink" font-size="34" font-weight="600">Designing a calmer week</text><text y="38" class="ui muted" font-size="12">31 August 2026  ·  387 words  ·  2 min read</text>
    <g transform="translate(0 68)" class="ui" font-size="12"><rect width="82" height="26" rx="13" fill="#d9dfd3"/><text x="13" y="18" fill="#56604d"># thinking</text><rect x="90" width="65" height="26" rx="13" fill="#ead8c9"/><text x="103" y="18" fill="#8c5037"># ideas</text><text x="167" y="18" class="muted">+ add tag</text></g>
    <g transform="translate(0 140)" class="serif ink" font-size="17"><text>There is a point where every system meant to help begins</text><text y="29">asking for attention of its own. The answer is not a better</text><text y="58">system. It is a quieter one.</text>
      <text y="118" font-size="23" font-weight="600">Three small intentions</text><text y="160">Keep the mornings unclaimed. Let the first hour belong to</text><text y="189">reading, walking, or the work that needs the whole mind.</text>
      <circle cx="6" cy="237" r="6" fill="#fbf8f1" stroke="#9b9083"/><text x="25" y="243">Choose one meaningful outcome for each day.</text><circle cx="6" cy="277" r="6" fill="#fbf8f1" stroke="#9b9083"/><text x="25" y="283">Leave white space between commitments.</text><circle cx="6" cy="317" r="6" fill="#c56f4b"/><path d="m2 317 3 3 6-7" fill="none" stroke="#fff"/><text x="25" y="323" fill="#766e64">Write a short closing note before leaving the desk.</text>
      <rect x="0" y="364" width="520" height="91" rx="8" fill="#f0e9de"/><rect x="0" y="364" width="3" height="91" rx="2" fill="#c56f4b"/><text x="24" y="398" font-style="italic">“A useful notebook does not hold everything.</text><text x="24" y="427" font-style="italic">It helps you notice what deserves to remain.”</text>
      <text y="506">Related: </text><text x="67" y="506" fill="#ad5f40" text-decoration="underline">[[The shape of attention]]</text></g>
  </g>
