    <text x="322" y="139" class="ink" font-size="18" font-weight="650">All notes</text><text x="576" y="139" class="muted" font-size="20">•••</text>
    <rect x="316" y="158" width="274" height="104" rx="10" fill="#e7ded0"/><rect x="316" y="158" width="3" height="104" rx="2" fill="#c56f4b"/><text x="334" y="186" class="ink" font-size="14" font-weight="650">Designing a calmer week</text><text x="334" y="211" class="muted" font-size="12">A system should create space for attention,</text><text x="334" y="228" class="muted" font-size="12">not become another source of noise…</text><text x="334" y="248" class="muted" font-size="11">Today · 10:42</text>
    <g><text x="334" y="297" class="ink" font-size="14" font-weight="600">Books to revisit this autumn</text><text x="334" y="319" class="muted" font-size="12">Fragments on craft, place and memory…</text><text x="334" y="339" class="muted" font-size="11">Yesterday</text><path d="M316 357h274" class="hair"/>
    <text x="334" y="389" class="ink" font-size="14" font-weight="600">The garden as a notebook</text><text x="334" y="411" class="muted" font-size="12">Observe first. Name things later.</text><text x="334" y="431" class="muted" font-size="11">28 Aug</text><path d="M316 449h274" class="hair"/>
    <text x="334" y="481" class="ink" font-size="14" font-weight="600">Project language &amp; principles</text><text x="334" y="503" class="muted" font-size="12">Useful software can still feel humane…</text><text x="334" y="523" class="muted" font-size="11">26 Aug</text></g>
